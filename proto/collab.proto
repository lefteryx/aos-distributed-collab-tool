syntax = "proto3";
package collab;

// ---------- Messages ----------
message Empty {}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  bool ok = 1;
  string token = 2;
  string message = 3;
}

message LogoutRequest {
  string token = 1;
}

message Status {
  bool ok = 1;
  string message = 2;
  int32 new_version = 3;
}

message GetRequest {
  string token = 1;
  string doc_id = 2;
}

message GetResponse {
  bool ok = 1;
  string content = 2;
  int32 version = 3;
  string message = 4;
}

message PostRequest {
  string token = 1;
  string doc_id = 2;
  string content = 3;
  string lock_token = 4;
  bool ask_llm = 5;
  int32 base_version = 6;
}

message PostResponse {
  bool ok = 1;
  string message = 2;
  int32 new_version = 3;
  string llm_suggestion = 4;
}

message LockRequest {
  string token = 1;
  string doc_id = 2;
}

message LockResponse {
  bool ok = 1;
  string lock_token = 2;
  int64 expires_at = 3;
  string message = 4;
}

message UnlockRequest {
  string token = 1;
  string doc_id = 2;
  string lock_token = 3;
}

message HeartbeatRequest {
  string token = 1;
}

message PresenceUpdate {
  string username = 1;
  bool online = 2;
  int64 last_seen = 3;
}

// LLM service messages
message LLMRequest {
  string request_id = 1;
  string query = 2;
  string context = 3;
  string mode = 4;
}

message LLMResponse {
  string request_id = 1;
  string answer = 2;
}

message AskSuggestionRequest {
  string token = 1;
  string doc_id = 2;
  string mode = 3;
  string prompt = 4;
}

message AskSuggestionResponse {
  bool ok = 1;
  int32 suggestion_id = 2;
  string message = 3;
  string suggestion_preview = 4;
  string suggestion_text = 5;
}

message ApplySuggestionRequest {
  string token = 1;
  int32 suggestion_id = 2;
  bool accept = 3;
}

message ApplySuggestionResponse {
  bool ok = 1;
  string message = 2;
  int32 new_version = 3;
}

// Raft messages
message RequestVoteRequest {
  int32 term = 1;
  string candidateId = 2;
  int32 lastLogIndex = 3;
  int32 lastLogTerm = 4;
}
message RequestVoteResponse {
  int32 term = 1;
  bool voteGranted = 2;
}

message LogEntry {
  int32 index = 1;
  int32 term = 2;
  string op = 3;
  string payload = 4;
}

message AppendEntriesRequest {
  int32 term = 1;
  string leaderId = 2;
  int32 prevLogIndex = 3;
  int32 prevLogTerm = 4;
  repeated LogEntry entries = 5;
  int32 leaderCommit = 6;
}
message AppendEntriesResponse {
  int32 term = 1;
  bool success = 2;
  int32 matchIndex = 3;
}

// ---------- Services ----------
service ClientService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (Status);

  rpc Get(GetRequest) returns (GetResponse);
  rpc Post(PostRequest) returns (PostResponse);

  rpc Lock(LockRequest) returns (LockResponse);
  rpc Unlock(UnlockRequest) returns (Status);

  rpc SubscribePresence(HeartbeatRequest) returns (stream PresenceUpdate);
  rpc Heartbeat(HeartbeatRequest) returns (Status);

  rpc Health(Empty) returns (Status);

  rpc AskSuggestion(AskSuggestionRequest) returns (AskSuggestionResponse);
  rpc ApplySuggestion(ApplySuggestionRequest) returns (ApplySuggestionResponse);
}

service LLMService {
  rpc GetLLMAnswer(LLMRequest) returns (LLMResponse);
}

service Raft {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}
